<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线上书店 - 首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-4xl font-bold text-center mb-8 bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                线上书店
            </h1>
            <p class="text-gray-600 text-center mb-8">
                欢迎来到我们的线上书店，浏览精选图书，享受阅读的乐趣
            </p>
            <div class="space-y-4">
                <a href="html/register.html" 
                   class="block w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 px-6 rounded-lg font-semibold text-center hover:from-purple-700 hover:to-blue-700 transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    注册账号
                </a>
                <a href="html/login.html" 
                   class="block w-full bg-white text-purple-600 py-3 px-6 rounded-lg font-semibold text-center border-2 border-purple-600 hover:bg-purple-50 transition-all duration-200">
                    登录
                </a>
                <a href="books" 
                   class="block w-full bg-gray-100 text-gray-700 py-3 px-6 rounded-lg font-semibold text-center hover:bg-gray-200 transition-all duration-200">
                    浏览图书（游客模式）
                </a>
            </div>
        </div>
    </div>
</body>
</html>
