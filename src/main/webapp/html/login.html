<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 线上书店</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-3xl font-bold text-center mb-6 bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                用户登录
            </h1>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all">
                </div>
                
                <div id="message" class="hidden text-sm text-center py-2 rounded-lg"></div>
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:from-purple-700 hover:to-blue-700 transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    登录
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="register.html" class="text-purple-600 hover:text-purple-700 text-sm font-medium">
                    还没有账号？立即注册
                </a>
            </div>
            
            <div class="mt-4 text-center">
                <a href="../index.html" class="text-gray-500 hover:text-gray-700 text-sm">
                    返回首页
                </a>
            </div>
        </div>
    </div>

    <script>
        // 根据当前页面路径计算应用根路径（兼容部署在根路径 / 或 /bookstore 等）
        function getBasePath() {
            var path = (window.location.pathname || '/').replace(/\/+$/, '');
            var idx = path.indexOf('/html/');
            return idx >= 0 ? path.substring(0, idx) : '';
        }

        // 按顺序尝试的根路径：当前推断的路径、根路径、/bookstore（本地 Tomcat 常见）
        function getBasePathsToTry() {
            var base = getBasePath();
            var list = [base];
            if (base !== '') list.push('');
            if (base !== '/bookstore') list.push('/bookstore');
            return list;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');
            const submitBtn = this.querySelector('button[type="submit"]');
            
            // 显示加载状态
            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';
            messageDiv.classList.add('hidden');
            
            var params = new URLSearchParams();
            for (const [key, value] of formData.entries()) {
                params.append(key, value);
            }
            var body = params.toString();
            var result = null;
            var lastStatus = 0;
            var successfulBasePath = getBasePath();
            var basePathsToTry = getBasePathsToTry();

            try {
                for (var i = 0; i < basePathsToTry.length; i++) {
                    var basePath = basePathsToTry[i];
                    var url = basePath + '/auth/login';
                    var response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body
                    });
                    lastStatus = response.status;
                    var contentType = response.headers.get('Content-Type') || '';
                    if (contentType.indexOf('application/json') !== -1) {
                        result = await response.json();
                        if (response.ok && result && result.success) {
                            successfulBasePath = basePath;
                            break;
                        }
                        if (result && typeof result.success !== 'undefined') break;
                    }
                    if (response.ok) break;
                }

                if (!result) {
                    result = {
                        success: false,
                        message: lastStatus === 404
                            ? '登录接口未找到。请从首页进入：' + window.location.origin + (getBasePath() || '') + ' 再点击「登录」'
                            : '服务器异常，请稍后重试'
                    };
                }
                
                messageDiv.classList.remove('hidden');
                if (result.success) {
                    messageDiv.className = 'text-sm text-center py-2 rounded-lg bg-green-100 text-green-700';
                    messageDiv.textContent = result.message;
                    setTimeout(() => {
                        window.location.href = successfulBasePath + '/books';
                    }, 1000);
                } else {
                    messageDiv.className = 'text-sm text-center py-2 rounded-lg bg-red-100 text-red-700';
                    messageDiv.textContent = result.message;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '登录';
                }
            } catch (error) {
                messageDiv.classList.remove('hidden');
                messageDiv.className = 'text-sm text-center py-2 rounded-lg bg-red-100 text-red-700';
                messageDiv.textContent = '网络错误，请稍后重试';
                submitBtn.disabled = false;
                submitBtn.textContent = '登录';
            }
        });
    </script>
</body>
</html>
