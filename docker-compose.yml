services:
  # MySQL数据库（容器名由 compose 自动生成，如 761-db-1，避免与旧容器冲突）
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bookstore
      TZ: Asia/Shanghai
    ports:
      - "3747:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network

  # 后端服务（Tomcat）（容器名由 compose 自动生成，如 761-backend-1）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8747:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:

networks:
  bookstore-network:
    driver: bridge
